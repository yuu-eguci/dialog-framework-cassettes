[tool.ruff]
target-version = "py315"
line-length = 100
extend-exclude = ["cassette-*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
files = ["tools", "tests"]
strict = true
explicit_package_bases = true

[tool.pytest]
pythonpath = ["."]
testpaths = ["tests"]
